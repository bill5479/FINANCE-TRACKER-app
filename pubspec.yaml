name: fintracker_app
description: Premium local-first financial tracker with liquid glass UI.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  liquid_glass_renderer: ^0.1.1-dev.26
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  intl: ^0.19.0
  fl_chart: ^0.70.2
  pdf: ^3.12.0
  csv: ^6.0.0
  uuid: ^4.5.3
  google_fonts: ^6.3.3
  flutter_local_notifications: ^18.0.1
  font_awesome_flutter: ^10.12.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
